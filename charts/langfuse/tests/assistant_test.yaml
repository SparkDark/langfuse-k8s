suite: Langfuse Assistant values
templates:
  - validations.yaml
  - web/deployment.yaml
  - worker/deployment.yaml
tests:
  - it: does not set Assistant env when disabled
    values:
      - ../values.lint.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LANGFUSE_IN_APP_AGENT_ENABLED
            value: "true"
        template: web/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LANGFUSE_IN_APP_AGENT_SANDBOX_PROVIDER
            value: "lambda-microvm"
        template: worker/deployment.yaml

  - it: sets the model on web and worker and sandbox only on worker
    values:
      - ../values.lint.yaml
    set:
      langfuse:
        assistant:
          enabled: true
          provider: bedrock
          model: eu.anthropic.claude-opus-5
          bedrockRegion: eu-west-1
          sandbox:
            provider: lambda-microvm
            imageIdentifier: arn:aws:lambda:eu-west-1:123456789012:microvm-image:langfuse-in-app-agent-sandbox
            executionRoleArn: arn:aws:iam::123456789012:role/sandbox-execution
            region: eu-west-1
            egressNetworkConnectorArn: arn:aws:lambda:eu-west-1:123456789012:network-connector:deny-all
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LANGFUSE_IN_APP_AGENT_ENABLED
            value: "true"
        template: web/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LANGFUSE_AI_MODEL
            value: eu.anthropic.claude-opus-5
        template: worker/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LANGFUSE_IN_APP_AGENT_SANDBOX_PROVIDER
            value: lambda-microvm
        template: worker/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LANGFUSE_IN_APP_AGENT_SANDBOX_PROVIDER
            value: lambda-microvm
        template: web/deployment.yaml

  - it: points the worker at the in-cluster web Service when MCP overlay is enabled
    values:
      - ../values.lint.yaml
    set:
      langfuse:
        assistant:
          mcp:
            useInternalWebUrl: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LANGFUSE_MCP_ALLOWED_HOSTS
            value: RELEASE-NAME-langfuse-web
        template: web/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NEXTAUTH_URL
            value: http://RELEASE-NAME-langfuse-web:3000
        template: worker/deployment.yaml

  - it: fails when sandbox provider is set without required ARNs
    values:
      - ../values.lint.yaml
    set:
      langfuse:
        assistant:
          sandbox:
            provider: lambda-microvm
    asserts:
      - failedTemplate:
          errorMessage: "langfuse.assistant.sandbox.imageIdentifier, executionRoleArn, and region are required when langfuse.assistant.sandbox.provider is lambda-microvm"

  - it: fails when Assistant is enabled without a model
    values:
      - ../values.lint.yaml
    set:
      langfuse:
        assistant:
          enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "langfuse.assistant.model is required when langfuse.assistant.enabled is true"
